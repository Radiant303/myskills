name: Package Extensions

# Builds a zip for every Chrome extension in the repo.
# - On push / PR: uploads the zips as workflow artifacts.
# - On a version tag (e.g. v1.0.0): attaches the zips to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package each extension
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in chrome-extensions/*/; do
            name=$(basename "$dir")
            echo "Packaging $name"
            (cd "$dir" && zip -r "../../dist/$name.zip" . -x '*.DS_Store' -x '__MACOSX/*')
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extensions
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach zips to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
