name: Package Extensions and Skills

# Builds a zip for every Chrome extension in the repo.
# - On push / PR: uploads the zips as workflow artifacts.
# - On a version tag (e.g. v1.0.0): attaches the zips to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test packaging exclusions
        run: python tests/package_test.py

      - name: Package extensions and portable skills
        run: python scripts/package_artifacts.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions-and-skills
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach zips to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
